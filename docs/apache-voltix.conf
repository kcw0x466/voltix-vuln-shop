# Classroom-only example. Requires mod_proxy and mod_proxy_http.
<VirtualHost *:80>
    ServerName voltix.lab.test
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    <Location />
        Require local
        # Add only the actual isolated classroom subnet if needed.
        # Require ip 192.0.2.0/24
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/voltix-error.log
    CustomLog ${APACHE_LOG_DIR}/voltix-access.log combined
</VirtualHost>
