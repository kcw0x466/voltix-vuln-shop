{% extends 'base.html' %}{% block content %}<main class="section"><div class="container"><h2>상품 {{ '수정' if p else '등록' }}</h2><form method="post">{{ csrf() }}{% for key,label in [('name','상품명'),('description','설명'),('price','원화 가격'),('stock','재고')] %}<div class="form-group"><label>{{ label }}<input class="input" name="{{ key }}" type="{{ 'number' if key in ['price','stock'] else 'text' }}" value="{{ p[key] if p else '' }}" required {% if key in ['price','stock'] %}min="{{ 1 if key=='price' else 0 }}"{% endif %}></label></div>{% endfor %}<div class="form-group"><label>카테고리<select name="category_id" class="input-select">{% for c in categories %}<option value="{{ c.id }}" {% if p and p.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label></div><div class="form-group"><label>상품 이미지<select name="image" class="input-select">{% for n in range(1,10) %}{% set image='product%02d.png'|format(n) %}<option {% if p and p.image==image %}selected{% endif %}>{{ image }}</option>{% endfor %}</select></label></div><div class="actions"><button class="primary-btn">저장</button>{% if p %}<button class="btn btn-danger" name="delete" value="1" formnovalidate>판매 종료 (삭제)</button>{% endif %}</div></form></div></main>{% endblock %}
