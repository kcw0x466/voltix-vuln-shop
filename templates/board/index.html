{% extends 'base.html' %}{% block content %}<main class="section"><div class="container"><div class="section-title"><h2>고객센터 · 커뮤니티</h2><p>상품 문의부터 디지털 라이프 이야기까지</p></div><div class="actions"><a class="primary-btn" href="{{ url_for('board.create') }}">글쓰기</a>{% if g.user %}<a href="{{ url_for('board.traversal',file='guide.txt') }}">첨부파일 이용 안내</a>{% endif %}</div><div class="table-responsive"><table class="table"><thead><tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th></tr></thead><tbody>{% for p in posts %}<tr><td>{{ p.id }}</td><td><a href="{{ url_for('board.detail',pid=p.id) }}">{{ p.title }}</a></td><td>{{ p.name }}</td><td>{{ p.created_at }}</td></tr>{% endfor %}</tbody></table></div></div></main>{% endblock %}
