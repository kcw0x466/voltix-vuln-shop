{% extends 'base.html' %}{% block content %}<main class="section"><div class="container"><h2>{{ '게시글 수정' if post else '게시글 작성' }}</h2><form method="post" enctype="multipart/form-data">{{ csrf() }}<div class="form-group"><label>제목<input class="input" name="title" required maxlength="200" value="{{ post.title if post else '' }}"></label></div><div class="form-group"><label>내용<textarea class="input" name="body" required maxlength="20000">{{ post.body if post else '' }}</textarea></label></div>{% if not post %}<div class="form-group"><label>첨부파일 (최대 2MB)<input type="file" name="attachment"></label></div>{% endif %}<button class="primary-btn">저장</button></form></div></main>{% endblock %}
