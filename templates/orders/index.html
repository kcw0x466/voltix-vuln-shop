{% extends 'base.html' %}{% block content %}<main class="section"><div class="container"><h2>주문 내역</h2><div class="table-responsive"><table class="table"><thead><tr><th>주문 번호</th><th>주문 일시</th><th>주문 금액</th><th>상태</th><th>상세</th></tr></thead><tbody>{% for o in orders %}<tr><td>#{{ o.id }}</td><td>{{ o.created_at }}</td><td>{{ o.total|krw }}</td><td>{{ o.status }}</td><td><a href="{{ url_for('orders.detail',oid=o.id) }}">주문 상세</a></td></tr>{% else %}<tr><td colspan="5">주문 내역이 없습니다.</td></tr>{% endfor %}</tbody></table></div></div></main>{% endblock %}
