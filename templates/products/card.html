<div class="product"><div class="product-img"><a href="{{ url_for('products.detail',pid=p.id) }}"><img src="{{ url_for('static',filename='img/'+p.image) }}" alt="{{ p.name }}" loading="lazy" style="width:100%"></a><div class="product-label"><span class="new">VOLTIX</span></div></div><div class="product-body"><p class="product-category">{{ p.category }}</p><h3 class="product-name"><a href="{{ url_for('products.detail',pid=p.id) }}">{{ p.name }}</a></h3><h4 class="product-price">{{ p.price|krw }}</h4><p>{{ '재고 '+p.stock|string+'개' if p.stock else '품절' }}</p></div><div class="add-to-cart"><form method="post" action="{{ url_for('cart.add',pid=p.id) }}">{{ csrf() }}<button class="add-to-cart-btn" {% if not p.stock %}disabled{% endif %}><i class="fa fa-shopping-cart"></i> 장바구니 담기</button></form></div></div>
