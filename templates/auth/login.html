{% extends 'base.html' %}{% block content %}<main class="section"><div class="container"><div class="row"><div class="col-md-6 col-md-offset-3"><div class="section-title"><h2>{{ '회원가입' if register else '로그인' }}</h2><p>VOLTIX와 함께 디지털 라이프를 시작하세요.</p></div><form method="post">{{ csrf() }}<div class="form-group"><label for="username">아이디</label><input id="username" class="input" name="username" autocomplete="username" required maxlength="40"></div>{% if register %}<div class="form-group"><label for="name">가상 이름</label><input id="name" class="input" name="name" required maxlength="60"></div>{% endif %}<div class="form-group"><label for="password">비밀번호</label><input id="password" class="input" type="password" name="password" autocomplete="{{ 'new-password' if register else 'current-password' }}" required></div><button class="primary-btn">{{ '가입하고 가상 포인트 받기' if register else '로그인' }}</button></form><div class="actions"><a href="{{ url_for('auth.login') if register else url_for('auth.register') }}">{{ '로그인으로 이동' if register else '아직 회원이 아니신가요? 회원가입' }}</a></div><p class="safe-note">교육용 서비스입니다. 실생활에서 쓰는 개인정보와 비밀번호를 입력하지 마세요.</p></div></div></div></main>{% endblock %}
